name: CD Pipeline - Deploy to Kubernetes

on:
  push:
    branches: [ "master", "main" ]

concurrency:
  group: cd-kubernetes
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  # --------------------------------------------------------------------------
  # 1. Build and Push Immutable Production Images
  # --------------------------------------------------------------------------
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: meta
        run: |
          SHA_TAG="${{ github.sha }}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "API_IMAGE=${IMAGE_API,,}" >> $GITHUB_ENV
          echo "WEB_IMAGE=${IMAGE_WEB,,}" >> $GITHUB_ENV

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://poster-parlor.local/api/v1
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 2. Deploy to Kubernetes Cluster
  # --------------------------------------------------------------------------
  deploy-k8s:
    name: Deploy to Production Cluster
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Remote/Managed Kubernetes Authentication
      # For production clusters (EKS, GKE, AKS, or custom kubeconfig):
      # Configure KUBECONFIG secret in GitHub Repository Secrets.
      - name: Configure Kubeconfig
        if: env.KUBECONFIG_SECRET != ''
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # Apply configuration and update deployments with immutable image tags
      - name: Deploy Manifests and Update Images
        if: env.KUBECONFIG_SECRET != ''
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
          TAG: ${{ needs.publish-images.outputs.image_tag }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/mongo.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

          # Update Deployments with new immutable commit-tagged images
          kubectl -n poster-parlor set image deployment/api-deployment api=${{ env.API_IMAGE }}:${TAG}
          kubectl -n poster-parlor set image deployment/web-deployment web=${{ env.WEB_IMAGE }}:${TAG}

          # Await zero-downtime rolling update completion
          kubectl -n poster-parlor rollout status deployment/api-deployment --timeout=180s
          kubectl -n poster-parlor rollout status deployment/web-deployment --timeout=180s

