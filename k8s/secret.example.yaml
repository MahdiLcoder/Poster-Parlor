apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: poster-parlor
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: poster-parlor
type: Opaque
stringData:
  # Database connection string
  # Format: mongodb://<username>:<password>@mongo-service:27017/<dbname>?authSource=admin
  DB_URL: "mongodb://admin:admin123@mongo-service:27017/poster_parlor_dev?authSource=admin"

  # Google OAuth Credentials
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret_here"

  # JWT Secrets (Minimum 32 characters)
  JWT_ACCESS_TOKEN_SECRET: "your_super_secret_jwt_access_key_here_minimum_32_chars"
  JWT_REFRESH_TOKEN_SECRET: "your_super_secret_jwt_refresh_key_here_minimum_32_chars"

  # Cloudinary Storage
  CLOUDINARY_CLOUD_NAME: "your_cloudinary_cloud_name"
  CLOUDINARY_API_KEY: "your_cloudinary_api_key"
  CLOUDINARY_API_SECRET: "your_cloudinary_api_secret"

  # Razorpay Gateway
  RAZORPAY_API_KEY: "your_razorpay_key_id"
  RAZORPAY_API_SECRET: "your_razorpay_key_secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: poster-parlor
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: poster-parlor
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "admin123"
  MONGO_INITDB_DATABASE: "poster_parlor_dev"

