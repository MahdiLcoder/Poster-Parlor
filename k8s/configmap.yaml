apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: poster-parlor
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: poster-parlor
data:
  NODE_ENV: "production"
  PORT: "5000"
  ALLOWED_ORIGINS: "http://localhost:3000,http://poster-parlor.local"
  DB_NAME: "poster_parlor_dev"
  POOL_SIZE: "10"
  GOOGLE_CALLBACK_URL: "http://poster-parlor.local/api/v1/auth/google/callback"
  JWT_ACCESS_TOKEN_EXPIRES_IN: "15m"
  JWT_REFRESH_TOKEN_EXPIRES_IN: "7d"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: poster-parlor
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: poster-parlor
data:
  PORT: "3000"
  NODE_ENV: "production"

