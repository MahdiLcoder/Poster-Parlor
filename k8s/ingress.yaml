apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poster-parlor-ingress
  namespace: poster-parlor
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: poster-parlor
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: poster-parlor.local
      http:
        paths:
          # Route all API traffic to NestJS backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 5000
          # Route all frontend traffic to Next.js service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000

